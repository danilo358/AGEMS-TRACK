<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGEMS Track Land — Acesso ao Sistema</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #374151;
            -webkit-font-smoothing: antialiased;
        }

        .login-wrap {
            width: 100%;
            max-width: 420px;
        }

        /* Card */
        .login-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 2.5rem 2.25rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
        }

        /* Brand */
        .brand-top {
            text-align: center;
            margin-bottom: 2rem;
        }
        .brand-icon {
            width: 52px;
            height: 52px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a56db;
            font-size: 1.4rem;
            margin: 0 auto 1rem;
        }
        .brand-name {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.02em;
        }
        .brand-subtitle {
            font-size: 0.78rem;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-top: 0.2rem;
        }

        .desc-text {
            font-size: 0.875rem;
            color: #6b7280;
            text-align: center;
            margin-bottom: 1.75rem;
            line-height: 1.55;
        }
        .desc-text strong { color: #111827; font-weight: 600; }

        /* Error */
        .alert-error {
            background: #fef2f2;
            border: 1px solid #fca5a5;
            border-radius: 10px;
            padding: 0.8rem 1rem;
            font-size: 0.85rem;
            color: #991b1b;
            margin-bottom: 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        /* Form */
        .form-group { margin-bottom: 1.25rem; }
        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.4rem;
        }
        .input-wrap { position: relative; }
        .input-wrap i {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 0.9rem;
            pointer-events: none;
        }
        .input-field {
            width: 100%;
            padding: 0.7rem 0.9rem 0.7rem 2.6rem;
            background: #f9fafb;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            color: #111827;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        .input-field:focus {
            background: #fff;
            border-color: #1a56db;
            box-shadow: 0 0 0 3px rgba(26,86,219,0.12);
        }

        /* Submit */
        .btn-submit {
            width: 100%;
            padding: 0.8rem 1rem;
            background: #1a56db;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.35rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: background 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
            box-shadow: 0 2px 4px rgba(26,86,219,0.2);
        }
        .btn-submit:hover:not(:disabled) {
            background: #1e429f;
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(26,86,219,0.28);
        }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Footer note */
        .login-footer {
            text-align: center;
            margin-top: 1.75rem;
            padding-top: 1.35rem;
            border-top: 1px solid #f1f5f9;
            font-size: 0.78rem;
            color: #9ca3af;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        /* Spinner */
        .spinner {
            width: 15px; height: 15px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.65s linear infinite;
            display: inline-block;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* App strip at top */
        .app-bar {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.78rem;
            color: #9ca3af;
            justify-content: center;
        }
        .app-bar i { color: #6b7280; }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="app-bar">
            <i class="fa-solid fa-satellite-dish"></i>
            <span>Plataforma de Auditoria de Frota — AGEMS / Track Land</span>
        </div>

        <div class="login-card">
            <div class="brand-top">
                <div class="brand-icon">
                    <i class="fa-solid fa-satellite-dish"></i>
                </div>
                <div class="brand-name">Track Land</div>
                <div class="brand-subtitle">Auditoria de Frota · AGEMS</div>
            </div>

            <p class="desc-text">
                Acesse com as credenciais institucionais do portal
                <strong>monitora.ms.gov.br</strong> para consultar os relatórios operacionais.
            </p>

            {% if error %}
            <div class="alert-error">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label for="email">E-mail institucional</label>
                    <div class="input-wrap">
                        <i class="fa-regular fa-envelope"></i>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="input-field"
                            placeholder="seu@email.gov.br"
                            required
                            autocomplete="username"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="senha">Senha de acesso</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            class="input-field"
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        >
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="btnLogin">
                    <span>Acessar o Sistema</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="login-footer">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Acesso restrito e monitorado · AGEMS</span>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function () {
            var btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div><span>Autenticando...</span>';
        });
    </script>
</body>
</html>
