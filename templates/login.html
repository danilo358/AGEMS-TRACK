<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AGEMS Track Land — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e1a;--surface:rgba(255,255,255,0.05);--border:rgba(255,255,255,0.10);--accent:#00d4ff;--accent2:#7c3aed;--text:#e2e8f0;--muted:#64748b;--danger:#f87171}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.25;animation:float 10s ease-in-out infinite;pointer-events:none;z-index:0}
.o1{width:500px;height:500px;background:#7c3aed;top:-150px;left:-150px}
.o2{width:400px;height:400px;background:#00d4ff;bottom:-100px;right:-100px;animation-delay:-5s}
.o3{width:300px;height:300px;background:#10b981;top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:-3s}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}
.card{position:relative;z-index:10;background:var(--surface);backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:24px;padding:48px 44px;width:100%;max-width:430px;box-shadow:0 32px 80px rgba(0,0,0,.5);animation:fadeUp .6s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.logo-wrap{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.logo-icon{width:52px;height:52px;background:linear-gradient(135deg,var(--accent2),var(--accent));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 8px 24px rgba(124,58,237,.4)}
.logo-text h1{font-size:20px;font-weight:800;background:linear-gradient(90deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-text p{font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.subtitle{font-size:13px;color:var(--muted);margin-bottom:28px;line-height:1.6}
.form-group{margin-bottom:18px}
label{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
input[type="email"],input[type="password"]{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:12px;padding:14px 16px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,212,255,.15)}
.btn{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:transform .15s,box-shadow .15s;box-shadow:0 8px 24px rgba(124,58,237,.35)}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,212,255,.3)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.error-box{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--danger);margin-bottom:18px}
.divider{height:1px;background:var(--border);margin:28px 0 20px}
.footer{text-align:center;font-size:11px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
</style>
</head>
<body>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>
<div class="card">
  <div class="logo-wrap">
    <div class="logo-icon">🛰️</div>
    <div class="logo-text">
      <h1>AGEMS · Track Land</h1>
      <p>Sistema de Auditoria de Frota</p>
    </div>
  </div>
  <p class="subtitle">Acesse com suas credenciais do portal <strong>monitora.ms.gov.br</strong> para gerar os relatórios operacionais.</p>
  {% if error %}<div class="error-box">⚠️ {{ error }}</div>{% endif %}
  <form method="POST" id="form">
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="seu@email.gov.br" required autocomplete="username"/>
    </div>
    <div class="form-group">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="••••••••" required autocomplete="current-password"/>
    </div>
    <button type="submit" class="btn" id="btn">Entrar no Sistema</button>
  </form>
  <div class="divider"></div>
  <p class="footer">🔒 Acesso restrito — AGEMS / Track Land</p>
</div>
<script>
document.getElementById('form').addEventListener('submit',function(){
  var b=document.getElementById('btn');
  b.disabled=true;
  b.innerHTML='<span class="spin"></span>Autenticando...';
});
</script>
</body>
</html>
