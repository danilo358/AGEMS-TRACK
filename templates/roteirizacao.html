{% extends "layout.html" %}

{% block content %}
<div class="page-header">
    <div class="page-header-left">
        <h1><i class="fa-solid fa-route"></i> Roteirização e Integração</h1>
        <p class="page-subtitle">Gere ou importe rotas e envie para a GlobalBus via SystemSat</p>
    </div>
</div>

<div class="card">
    <!-- Abas -->
    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('monitora')" id="btn-monitora">
            <i class="fa-solid fa-satellite-dish"></i> Gerar via Monitora
        </button>
        <button class="tab-btn" onclick="switchTab('kml')" id="btn-kml">
            <i class="fa-solid fa-file-import"></i> Importar KML
        </button>
    </div>

    <!-- ABA: Monitora -->
    <div id="tab-monitora" class="tab-content" style="display:block;">
        <form id="form-monitora" style="display:flex;flex-direction:column;gap:1.1rem;">
            <div style="display:flex;gap:1rem;flex-wrap:wrap;">
                <div style="flex:1;min-width:240px;">
                    <label>Pasta</label>
                    <select id="select-pasta" class="search-input" required>
                        <option value="">Carregando pastas...</option>
                    </select>
                </div>
                <div style="flex:1;min-width:240px;">
                    <label>Linha</label>
                    <select id="select-linha" class="search-input" disabled required>
                        <option value="">Selecione a Pasta primeiro</option>
                    </select>
                </div>
                <div style="flex:0 0 160px;min-width:140px;">
                    <label>Sentido</label>
                    <select id="select-sentido" class="search-input" required>
                        <option value="IDA">IDA</option>
                        <option value="VOLTA">VOLTA</option>
                    </select>
                </div>
            </div>

            <div style="max-width:220px;">
                <label>Distância entre pontos interpolados (metros)</label>
                <input type="number" id="distancia-monitora" class="search-input" style="width:100%;" value="200" min="50" required>
            </div>

            <div>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-play"></i> Gerar e Enviar Rota
                </button>
            </div>
        </form>
    </div>

    <!-- ABA: KML -->
    <div id="tab-kml" class="tab-content" style="display:none;">
        <form id="form-kml" style="display:flex;flex-direction:column;gap:1.1rem;">
            <div>
                <label>Arquivo KML</label>
                <input type="file" id="arquivo-kml" accept=".kml" class="search-input" required>
            </div>

            <div style="display:flex;gap:1rem;flex-wrap:wrap;">
                <div style="flex:1;min-width:200px;">
                    <label>Nome da Rota (RouteName)</label>
                    <input type="text" id="kml-nome" class="search-input" placeholder="Ex: PARANHOS - AMAMBAI" required>
                </div>
                <div style="flex:1;min-width:200px;">
                    <label>Empresa Origem (ClientBusIntegrationCode)</label>
                    <input type="text" id="kml-empresa" class="search-input" placeholder="ID de integração da empresa" required>
                </div>
                <div style="flex:0 0 160px;min-width:140px;">
                    <label>Direction (IdDirection)</label>
                    <select id="kml-direction" class="search-input" required>
                        <option value="1">IDA (1)</option>
                        <option value="2">VOLTA (2)</option>
                    </select>
                </div>
            </div>

            <div style="max-width:220px;">
                <label>Distância entre pontos interpolados (metros)</label>
                <input type="number" id="distancia-kml" class="search-input" style="width:100%;" value="50" min="10" required>
            </div>

            <div>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-upload"></i> Importar e Enviar KML
                </button>
            </div>
        </form>
    </div>

    <!-- Log de Status -->
    <div id="status-container" style="margin-top:1.5rem;display:none;">
        <h4 style="margin-bottom:0.6rem;display:flex;align-items:center;gap:0.4rem;color:#374151;">
            <i class="fa-solid fa-terminal" style="color:#6b7280;"></i> Log de Execução
        </h4>
        <div id="status-log" class="terminal-window" style="height:200px;color:#34d399;"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function switchTab(tab) {
        document.getElementById('tab-monitora').style.display = tab === 'monitora' ? 'block' : 'none';
        document.getElementById('tab-kml').style.display      = tab === 'kml'      ? 'block' : 'none';
        document.getElementById('btn-monitora').classList.toggle('active', tab === 'monitora');
        document.getElementById('btn-kml').classList.toggle('active', tab === 'kml');
    }

    function addLog(msg, isError = false) {
        const logBox = document.getElementById('status-log');
        document.getElementById('status-container').style.display = 'block';
        const color = isError ? '#ef4444' : '#34d399';
        logBox.innerHTML += `<div style="color:${color};">&gt; ${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    // Carregar pastas ao iniciar
    window.onload = function () {
        fetch('{{ url_for("api_pastas") }}')
            .then(r => r.json())
            .then(data => {
                const sel = document.getElementById('select-pasta');
                sel.innerHTML = '<option value="">Selecione a Pasta</option>';
                data.forEach(p => {
                    const empresaNome = p.empresa ? (p.empresa.nomeFantasia || p.empresa.razaoSocial) : 'Desconhecida';
                    sel.innerHTML += `<option value="${p.id}" data-empresa="${empresaNome}">${p.numero} - ${empresaNome}</option>`;
                });
            }).catch(e => {
                const sel = document.getElementById('select-pasta');
                sel.innerHTML = '<option value="">Erro ao carregar pastas</option>';
            });
    }

    // Carregar linhas ao selecionar pasta
    document.getElementById('select-pasta').addEventListener('change', function () {
        const pastaId = this.value;
        const selLinha = document.getElementById('select-linha');
        if (!pastaId) {
            selLinha.innerHTML = '<option value="">Selecione a Pasta primeiro</option>';
            selLinha.disabled = true;
            return;
        }

        selLinha.disabled = false;
        selLinha.innerHTML = '<option value="">Carregando linhas...</option>';

        fetch('{{ url_for("api_linhas") }}?pasta_id=' + pastaId)
            .then(r => r.json())
            .then(data => {
                selLinha.innerHTML = '<option value="">Selecione a Linha</option>';
                if (!data || data.length === 0) {
                    selLinha.innerHTML = '<option value="">Nenhuma linha encontrada nesta pasta</option>';
                    addLog('Nenhuma linha encontrada para esta pasta. Verifique no Monitora.', true);
                } else {
                    addLog(`${data.length} linha(s) encontrada(s) na pasta.`);
                    data.forEach(l => {
                        selLinha.innerHTML += `<option value="${l.id}">${l.numero || 'S/N'} - ${l.nome}</option>`;
                    });
                }
            }).catch(e => {
                selLinha.innerHTML = '<option value="">Erro ao carregar linhas</option>';
                addLog('Erro ao carregar linhas: ' + e.message, true);
            });
    });

    // Envio Monitora
    document.getElementById('form-monitora').addEventListener('submit', function (e) {
        e.preventDefault();
        const btn = this.querySelector('button');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processando...';

        const selPasta = document.getElementById('select-pasta');
        const empresaNome = selPasta.options[selPasta.selectedIndex].getAttribute('data-empresa');

        document.getElementById('status-log').innerHTML = '';
        addLog('Iniciando integração de rota via Monitora...');
        addLog('Aguarde, este processo pode levar alguns minutos...');

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 300000);

        fetch('{{ url_for("api_gerar_rota") }}', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal,
            body: JSON.stringify({
                pasta_id: document.getElementById('select-pasta').value,
                linha_id: document.getElementById('select-linha').value,
                sentido: document.getElementById('select-sentido').value,
                distancia: document.getElementById('distancia-monitora').value,
                empresa_nome: empresaNome
            })
        }).then(r => r.json()).then(data => {
            clearTimeout(timeoutId);
            if (data.error) addLog('Erro: ' + data.error, true);
            else addLog('SUCESSO! ' + (data.msg || 'Rota gerada e enviada com sucesso.'));
        }).catch(err => {
            clearTimeout(timeoutId);
            if (err.name === 'AbortError') {
                addLog('Erro: A requisicao excedeu o limite de 5 minutos. Verifique o terminal do servidor.', true);
            } else {
                addLog('Erro de conexao: ' + err.message, true);
            }
        }).finally(() => {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-play"></i> Gerar e Enviar Rota';
        });
    });

    // Envio KML
    document.getElementById('form-kml').addEventListener('submit', function (e) {
        e.preventDefault();
        const btn = this.querySelector('button');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processando...';

        document.getElementById('status-log').innerHTML = '';
        addLog('Iniciando processamento de KML...');

        const fileInput = document.getElementById('arquivo-kml');
        const formData = new FormData();
        formData.append('arquivo', fileInput.files[0]);
        formData.append('nome', document.getElementById('kml-nome').value);
        formData.append('empresa', document.getElementById('kml-empresa').value);
        formData.append('direction', document.getElementById('kml-direction').value);
        formData.append('distancia', document.getElementById('distancia-kml').value);

        fetch('{{ url_for("api_enviar_kml") }}', {
            method: 'POST',
            body: formData
        }).then(r => r.json()).then(data => {
            if (data.error) addLog('Erro: ' + data.error, true);
            else addLog('SUCESSO! ' + (data.msg || 'Rota do KML enviada com sucesso.'));
        }).catch(err => {
            addLog('Erro interno: ' + err, true);
        }).finally(() => {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-upload"></i> Importar e Enviar KML';
        });
    });
</script>
{% endblock %}
